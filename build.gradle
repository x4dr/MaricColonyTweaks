plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '0.1.110'
}

version = '1.0.0'
group = 'net.maric.colonytweaks'

ext.neoForgeVersion = '21.1.249'

base {
    archivesName = 'mariccolonytweaks'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

neoForge {
    version = project.neoForgeVersion
    mods {
        mariccolonytweaks {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.7"
    compileOnly files('libs/minecolonies-1.1.1368-1.21.1.jar', 'libs/blockui-1.0.212.jar')

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

    // MixinConfigNames reads the real mariccolonytweaks.mixins.json off the test classpath.
    testImplementation sourceSets.main.output

    // AppliedFeatures logs through com.mojang.logging, which is on the mod's compile classpath
    // via NeoForge, but the tests resolve it at runtime.
    testImplementation "com.mojang:logging:1.2.7"
    testImplementation "org.slf4j:slf4j-api:2.0.9"
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
